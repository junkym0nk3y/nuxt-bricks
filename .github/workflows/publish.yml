# Publishes the package to npm when a GitHub release is published.
#
# Authentication is npm trusted publishing (OIDC): no NPM_TOKEN secret, and the
# provenance attestation is generated automatically. It requires `id-token: write`
# here plus a trusted publisher configured on the npm side for this exact
# owner/repository/workflow triple.
#
# Two things have to be true before the first run can succeed, and neither is
# fixable from inside the repository:
#   - the repository and the package are public — provenance is refused otherwise;
#   - the package already exists in the registry. A trusted publisher is configured
#     on the settings page of an existing package, so the very first publish is a
#     manual one (interactive auth), and only after it does this workflow have a
#     publisher to authenticate against. Without that bootstrap the run ends in
#     ENEEDAUTH.
#
# The trigger is `released`, not `published`: `published` fires for pre-releases as
# well, and npm 11 refuses to publish a prerelease version without an explicit
# `--tag` ("You must specify a tag using --tag when publishing a prerelease
# version"). A prerelease channel would be a separate job with `--tag next`.
#
# The gate here is deliberately narrower than ci.yml — the checks, the module build
# and the fresh-consumer smoke, which is the only job that looks at the tarball the
# release actually ships. What is NOT re-run: the browser flows, the Postgres/MinIO
# integration, the external backend smoke, the playground production build, the
# bundle budget and the audit. The ancestry guard below is what makes skipping them
# defensible: the released commit is required to be on main, where the full matrix
# has already run.
#
# npm is pinned to the same version as ci.yml: the npm 10 bundled with Node 22 dies
# resolving the peer graph of a clean consumer, and 11.19 stopped running install
# scripts until each dependency is approved by hand. Trusted publishing needs
# npm >= 11.5.1, which the pin satisfies.
name: Publish

permissions:
    contents: read

on:
    release:
        types: [released]

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

env:
    NUXT_TELEMETRY_DISABLED: '1'

jobs:
    publish:
        name: npm publish (provenance)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            # The whole history is needed by the ancestry guard below; a shallow
            # clone has no merge base to check against.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org
            - run: npm i -g npm@11.13.0

            # A release tag that disagrees with package.json would publish a version
            # nobody tagged: the tarball and the git history would then point at
            # different sources for the same version number.
            #
            # The tag arrives through the environment rather than through a `${{ }}`
            # substitution inside the script: git accepts quotes, `$(…)` and
            # backticks in a ref name, so a substituted tag name is executable text
            # in a job that holds an OIDC token.
            - name: Release tag matches package version
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "$RELEASE_TAG" != "v$version" ] && [ "$RELEASE_TAG" != "$version" ]; then
                      echo "Release tag $RELEASE_TAG does not match package version $version"
                      exit 1
                  fi

            # Publishing a commit that never reached main would ship code the full CI
            # matrix has never seen: a release can be cut from any commit in the
            # repository, and this workflow re-runs only part of that matrix.
            - name: Released commit is on main
              run: |
                  git fetch --no-tags origin main
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "Commit $GITHUB_SHA is not an ancestor of origin/main"
                      exit 1
                  fi

            - run: npm ci
            - run: npm run dev:prepare
            - run: npm run format:check
            - run: npm run lint:check
            - run: npm run type-check
            - run: npm test
            - run: npm run build
            - run: npm run smoke:pack

            - run: npm publish --access public
