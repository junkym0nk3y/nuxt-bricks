# CI-гейт (P1 «Сделать CI и package contract воспроизводимыми»):
# format/lint/type/test → build (модуль + прод-сборка playground) → fresh-consumer
# smoke из npm pack → npm audit. Все jobs обязаны быть зелёными для merge в main
# (required checks настраиваются в branch protection репозитория).
name: CI

permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NUXT_TELEMETRY_DISABLED: '1'

jobs:
    checks:
        name: Format, lint, types, tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run dev:prepare
            - run: npm run format:check
            - run: npm run lint:check
            - run: npm run type-check
            - run: npm test

    build:
        name: Module build + playground prod build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run dev:prepare
            - run: npm run build
            - run: npm run dev:build
            # Bundle budget: gzip-размер initial JS (entry и published-страница)
            # не должен незаметно расти — бюджеты в scripts/bundle-budget.mjs.
            - run: npm run budget:bundle

    pack-smoke:
        name: Fresh consumer smoke (npm pack)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run smoke:pack

    integration:
        name: Integration smoke (Postgres + MinIO)
        runs-on: ubuntu-latest
        env:
            # Не-UTC зона процесса — регрессия A-07 (timestamptz-инварианты)
            TZ: Europe/Moscow
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: bricks
                    POSTGRES_PASSWORD: bricks
                    POSTGRES_DB: bricks
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U bricks"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - name: Start MinIO
              run: |
                  docker run -d --name minio -p 9000:9000 \
                      -e MINIO_ROOT_USER=bricks -e MINIO_ROOT_PASSWORD=bricks-secret \
                      minio/minio server /data
            - run: npm ci
            - run: npm run smoke:integration
              env:
                  BRICKS_IT_DATABASE_URL: postgres://bricks:bricks@127.0.0.1:5432/bricks
                  BRICKS_IT_S3_ENDPOINT: http://127.0.0.1:9000
                  BRICKS_IT_S3_ACCESS_KEY: bricks
                  BRICKS_IT_S3_SECRET_KEY: bricks-secret
                  BRICKS_IT_S3_BUCKET: bricks-it

    external:
        name: External backend smoke (Nitro-level)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run smoke:external

    e2e:
        name: Critical browser flows
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    audit:
        name: npm audit (prod deps)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            # Prod-зависимости — блокирующе (сейчас 0 уязвимостей, держим планку);
            # полный audit (включая dev) — информационно, не валит сборку.
            - run: npm audit --omit=dev
            - run: npm audit || true
