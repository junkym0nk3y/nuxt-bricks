# Автообновление зависимостей (P1 «CI и package contract»): npm еженедельно
# (minor/patch группируются в один PR, major — отдельными), GitHub Actions — еженедельно.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          minor-and-patch:
              update-types:
                  - minor
                  - patch
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
